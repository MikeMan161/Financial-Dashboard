<!doctype html>
<!-- class="dark" pins the whole app to the dark palette. The .dark block in
     index.css already defines every token, so this one attribute switches them
     all; removing it returns the app to following the light palette. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
